<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missile Impact Simulator</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .status-pill {
      position: absolute;
      bottom: 44px; /* clear of the cesium credit line */
      left: 16px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.80);
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 8px 14px;
      pointer-events: none;
      color: #ededed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .pill-title {
      font-size: 12px;
      font-weight: 700;
      color: #ededed;
      margin-bottom: 2px;
    }
    .pill-sub {
      font-size: 11px;
      color: #8a8a8a;
    }

    /* impact zone legend, shown after a launch */
    .legend {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      min-width: 236px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #262626;
      border-radius: 10px;
      color: #ededed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .legend.show { opacity: 1; transform: translateY(0); }
    .legend-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 8px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 22px;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
    .legend-name { flex: 1; }
    .legend-value {
      color: #8a8a8a;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      .legend { transform: none; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="statusPill" class="status-pill">
    <div class="pill-title" id="pillModeText">Map Click Mode: Launch site</div>
    <div class="pill-sub">Click globe to place pin | Drag pin to move | Drag globe to rotate</div>
  </div>
  <div id="legend" class="legend">
    <div class="legend-title">Impact zones</div>
    <div id="legendRows"></div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = "";

    // create esri satellite base layer.
    // server.arcgisonline.com is a separate (faster) host from the labels layer, so the two
    // don't compete for the browser's per-host connection limit.
    // blankTile=false makes esri return 404 instead of a "map data not yet available" image,
    // so cesium keeps showing the sharpest real tile it has.
    const esriBaseProvider = new Cesium.UrlTemplateImageryProvider({
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?blankTile=false",
      maximumLevel: 19,
      credit: "Esri World Imagery"
    });

    // create esri boundaries, places, and country borders overlay.
    // this layer has no tiles past level 17; cesium stretches level 17 when zoomed further.
    const esriBoundariesProvider = new Cesium.UrlTemplateImageryProvider({
      url: "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      maximumLevel: 17,
      credit: "Esri Boundaries and Places"
    });

    // cesium never retries a failed tile by default, so one slow response leaves a
    // permanent blurry hole. retry timeouts/network errors a few times; skip real 404s.
    function retryFailedTiles(provider) {
      provider.errorEvent.addEventListener((err) => {
        const status = err.error && err.error.statusCode;
        if (status === 404) return;
        if (err.timesRetried < 3) err.retry = true;
      });
    }
    retryFailedTiles(esriBaseProvider);
    retryFailedTiles(esriBoundariesProvider);

    let viewer;
    try {
      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: new Cesium.ImageryLayer(esriBaseProvider),
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        navigationHelpButton: false,
        animation: false,
        fullscreenButton: false,
      });
    } catch (e) {
      viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: esriBaseProvider,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        navigationHelpButton: false,
        animation: false,
        fullscreenButton: false,
      });
    }

    // add boundaries and places reference overlay on top of satellite imagery
    viewer.imageryLayers.add(new Cesium.ImageryLayer(esriBoundariesProvider));

    viewer.resolutionScale = window.devicePixelRatio || 1.0;
    viewer.scene.globe.showGroundAtmosphere = false;
    viewer.scene.globe.enableLighting = false;

    // smoother panning: keep more tiles in memory (default 100) so returning to an area
    // doesn't re-download it, and load neighbouring tiles before they scroll into view
    viewer.scene.globe.tileCacheSize = 1000;
    viewer.scene.globe.preloadSiblings = true;

    // hard zoom distance limits (100m minimum, 25,000km maximum)
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 100.0;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = 25000000.0;

    let currentPickMode = "origin";
    let lastVersion = -1;
    let lastFlyId = -1;

    // track mouse clicks vs drags
    let isLeftDown = false;
    let startScreenPos = null;
    let draggedPin = null;
    let hasMovedPastThreshold = false;

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction((movement) => {
      isLeftDown = true;
      startScreenPos = Cesium.Cartesian2.clone(movement.position);
      hasMovedPastThreshold = false;
      draggedPin = null;

      const picked = viewer.scene.pick(movement.position);
      if (Cesium.defined(picked) && picked.id) {
        const id = picked.id.id || picked.id;
        if (id === "origin_pin" || id === "dest_pin") {
          draggedPin = id;
          viewer.scene.screenSpaceCameraController.enableInputs = false;
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

    handler.setInputAction((movement) => {
      if (!isLeftDown) return;
      const dist = Cesium.Cartesian2.distance(startScreenPos, movement.endPosition);
      if (dist >= 6) {
        hasMovedPastThreshold = true;
      }
      if (draggedPin) {
        const ray = viewer.camera.getPickRay(movement.endPosition);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const entity = viewer.entities.getById(draggedPin);
          if (entity) {
            entity.position = cartesian;
          }
        }
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    handler.setInputAction((movement) => {
      if (!isLeftDown) return;
      isLeftDown = false;
      viewer.scene.screenSpaceCameraController.enableInputs = true;

      if (draggedPin) {
        const ray = viewer.camera.getPickRay(movement.position);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lon = Cesium.Math.toDegrees(carto.longitude);
          const lat = Cesium.Math.toDegrees(carto.latitude);
          const role = (draggedPin === "origin_pin") ? "origin" : "destination";
          sendPick(role, lon, lat);
        }
        draggedPin = null;
        return;
      }

      // click without dragging places or moves pin
      if (!hasMovedPastThreshold && currentPickMode !== "none") {
        const ray = viewer.camera.getPickRay(movement.position);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lon = Cesium.Math.toDegrees(carto.longitude);
          const lat = Cesium.Math.toDegrees(carto.latitude);
          sendPick(currentPickMode, lon, lat);
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_UP);

    function sendPick(role, lon, lat) {
      fetch("/api/pick", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, longitude: lon, latitude: lat })
      }).catch((err) => {
        console.warn("pick post error", err);
      });
    }

    // calculates arc samples for ballistic trajectory
    function computeTrajectoryPoints(oLon, oLat, dLon, dLat, segments = 50) {
      const c1 = Cesium.Cartographic.fromDegrees(oLon, oLat);
      const c2 = Cesium.Cartographic.fromDegrees(dLon, dLat);
      const geodesic = new Cesium.EllipsoidGeodesic(c1, c2);
      const totalDist = geodesic.surfaceDistance;
      const peakAltitude = Math.min(Math.max(totalDist * 0.12, 10000.0), 900000.0);

      const positions = [];
      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const interp = geodesic.interpolateUsingFraction(f);
        const h = Math.sin(f * Math.PI) * peakAltitude;
        positions.push(Cesium.Cartesian3.fromRadians(interp.longitude, interp.latitude, h));
      }
      return positions;
    }

    // calculates spherical circle boundary points for missile range
    function computeCirclePoints(centerLon, centerLat, radiusKm, numPoints = 72) {
      const points = [];
      const R = 6371.0;
      const radLat = Cesium.Math.toRadians(centerLat);
      const radLon = Cesium.Math.toRadians(centerLon);
      const dByR = radiusKm / R;

      for (let i = 0; i <= numPoints; i++) {
        const bearing = (i * 360.0 / numPoints) * Math.PI / 180.0;
        const lat = Math.asin(Math.sin(radLat) * Math.cos(dByR) + Math.cos(radLat) * Math.sin(dByR) * Math.cos(bearing));
        const lon = radLon + Math.atan2(Math.sin(bearing) * Math.sin(dByR) * Math.cos(radLat), Math.cos(dByR) - Math.sin(radLat) * Math.sin(lat));
        points.push(Cesium.Cartesian3.fromRadians(lon, lat, 100.0));
      }
      return points;
    }

    const PIN_LABEL_STYLE = {
      font: "600 13px 'Segoe UI', sans-serif",
      fillColor: Cesium.Color.fromCssColorString("#ededed"),
      showBackground: true,
      backgroundColor: Cesium.Color.BLACK.withAlpha(0.75),
      backgroundPadding: new Cesium.Cartesian2(10, 6),
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      pixelOffset: new Cesium.Cartesian2(0, -16)
    };

    // blast zones, outermost first so inner zones draw on top.
    // fill gets stronger toward the centre so severity reads at a glance.
    const ZONES = [
      { id: "ring_light",    key: "light_blast_1psi_km",    name: "Light blast (1 psi)",    color: "#fde047", alpha: 0.06 },
      { id: "ring_thermal",  key: "thermal_3rd_deg_km",     name: "3rd-degree burns",       color: "#f59e0b", alpha: 0.10 },
      { id: "ring_moderate", key: "moderate_blast_5psi_km", name: "Moderate blast (5 psi)", color: "#fb923c", alpha: 0.20 },
      { id: "ring_heavy",    key: "heavy_blast_20psi_km",   name: "Heavy blast (20 psi)",   color: "#ef4444", alpha: 0.32 },
      { id: "ring_fireball", key: "fireball_km",            name: "Fireball",               color: "#fff7d6", alpha: 0.60 },
    ];
    const GROW_MS = 700;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let lastImpactKey = null;

    function formatKm(km) {
      if (!(km > 0)) return "—";
      if (km < 1) return Math.round(km * 1000) + " m";
      return (km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString()) + " km";
    }

    function zoneRadiusMeters(zone, radii) {
      const km = Number(radii[zone.key]) || 0;
      return zone.key === "fireball_km" ? Math.max(km * 1000, 50) : km * 1000;
    }

    function clearImpact() {
      ZONES.forEach((z) => {
        viewer.entities.removeById(z.id);
        viewer.entities.removeById(z.id + "_edge");
      });
      document.getElementById("legend").classList.remove("show");
      lastImpactKey = null;
    }

    function renderImpact(state) {
      const radii = state.impact.radii_km;
      const lon = state.destination.longitude;
      const lat = state.destination.latitude;
      const key = JSON.stringify([lon, lat, radii]);
      if (key === lastImpactKey) return;  // same impact as before, keep current rings
      clearImpact();
      lastImpactKey = key;

      const center = Cesium.Cartesian3.fromDegrees(lon, lat, 0);
      const start = performance.now();
      // ease-out cubic: rings burst out fast then settle, like a shockwave
      const progress = () => {
        if (reduceMotion) return 1;
        const t = Math.min((performance.now() - start) / GROW_MS, 1);
        return 1 - Math.pow(1 - t, 3);
      };

      ZONES.forEach((z) => {
        const radius = zoneRadiusMeters(z, radii);
        if (!(radius > 0)) return;
        const axis = new Cesium.CallbackProperty(() => Math.max(radius * progress(), 1), false);
        viewer.entities.add({
          id: z.id,
          position: center,
          ellipse: {
            semiMajorAxis: axis,
            semiMinorAxis: axis,
            material: Cesium.Color.fromCssColorString(z.color).withAlpha(z.alpha),
            outline: false
          }
        });
      });

      // crisp edges are added once growth finishes (ground polylines are too costly to rebuild every frame)
      setTimeout(() => {
        if (lastImpactKey !== key) return;
        ZONES.forEach((z) => {
          const radius = zoneRadiusMeters(z, radii);
          if (!(radius > 0)) return;
          viewer.entities.add({
            id: z.id + "_edge",
            polyline: {
              positions: computeCirclePoints(lon, lat, radius / 1000, 128),
              width: 2,
              material: Cesium.Color.fromCssColorString(z.color).withAlpha(0.9),
              clampToGround: true
            }
          });
        });
      }, reduceMotion ? 0 : GROW_MS);

      // legend lists zones from the centre outward
      const rows = ZONES.slice().reverse().map((z) =>
        '<div class="legend-row">' +
          '<span class="legend-swatch" style="background:' + z.color + '"></span>' +
          '<span class="legend-name">' + z.name + '</span>' +
          '<span class="legend-value">' + formatKm(Number(radii[z.key])) + '</span>' +
        '</div>'
      ).join("");
      document.getElementById("legendRows").innerHTML = rows;
      document.getElementById("legend").classList.add("show");
    }

    function renderState(state) {
      // 1. origin pin
      if (state.origin && typeof state.origin.longitude === "number") {
        const pos = Cesium.Cartesian3.fromDegrees(state.origin.longitude, state.origin.latitude, 0);
        let origEntity = viewer.entities.getById("origin_pin");
        if (!origEntity) {
          origEntity = viewer.entities.add({
            id: "origin_pin",
            position: pos,
            point: {
              pixelSize: 14,
              color: Cesium.Color.fromCssColorString("#22c55e"),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: "Launch  ·  " + (state.origin.label || "Launch Site"),
              ...PIN_LABEL_STYLE
            }
          });
        } else {
          origEntity.position = pos;
          origEntity.label.text = "Launch  ·  " + (state.origin.label || "Launch Site");
        }
      } else {
        viewer.entities.removeById("origin_pin");
      }

      // 2. destination pin
      if (state.destination && typeof state.destination.longitude === "number") {
        const pos = Cesium.Cartesian3.fromDegrees(state.destination.longitude, state.destination.latitude, 0);
        let destEntity = viewer.entities.getById("dest_pin");
        if (!destEntity) {
          destEntity = viewer.entities.add({
            id: "dest_pin",
            position: pos,
            point: {
              pixelSize: 14,
              color: Cesium.Color.fromCssColorString("#ef4444"),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: "Target  ·  " + (state.destination.label || "Detonation Target"),
              ...PIN_LABEL_STYLE
            }
          });
        } else {
          destEntity.position = pos;
          destEntity.label.text = "Target  ·  " + (state.destination.label || "Detonation Target");
        }
      } else {
        viewer.entities.removeById("dest_pin");
      }

      // 3. max range circle and glowing perimeter border
      if (state.origin && typeof state.origin.longitude === "number" && state.missile && state.missile.max_range_km) {
        const radiusKm = Math.min(Number(state.missile.max_range_km) || 0, 9500);
        const radiusMeters = radiusKm * 1000.0;
        const pos = Cesium.Cartesian3.fromDegrees(state.origin.longitude, state.origin.latitude, 0);

        let rangeEntity = viewer.entities.getById("range_circle");
        if (!rangeEntity) {
          rangeEntity = viewer.entities.add({
            id: "range_circle",
            position: pos,
            ellipse: {
              semiMajorAxis: radiusMeters,
              semiMinorAxis: radiusMeters,
              material: Cesium.Color.WHITE.withAlpha(0.05),
              outline: false,
              height: 0
            }
          });
        } else {
          rangeEntity.position = pos;
          rangeEntity.ellipse.semiMajorAxis = radiusMeters;
          rangeEntity.ellipse.semiMinorAxis = radiusMeters;
        }

        const circlePoints = computeCirclePoints(state.origin.longitude, state.origin.latitude, radiusKm);
        let borderEntity = viewer.entities.getById("range_border_line");
        if (!borderEntity) {
          borderEntity = viewer.entities.add({
            id: "range_border_line",
            polyline: {
              positions: circlePoints,
              width: 3,
              material: new Cesium.PolylineGlowMaterialProperty({
                glowPower: 0.2,
                color: Cesium.Color.WHITE.withAlpha(0.55)
              }),
              clampToGround: true
            }
          });
        } else {
          borderEntity.polyline.positions = circlePoints;
        }
      } else {
        viewer.entities.removeById("range_circle");
        viewer.entities.removeById("range_border_line");
      }

      // 4. trajectory line
      if (state.origin && state.destination) {
        const arcPositions = computeTrajectoryPoints(
          state.origin.longitude, state.origin.latitude,
          state.destination.longitude, state.destination.latitude
        );
        let lineEntity = viewer.entities.getById("trajectory_line");
        if (!lineEntity) {
          lineEntity = viewer.entities.add({
            id: "trajectory_line",
            polyline: {
              positions: arcPositions,
              width: 3,
              material: new Cesium.PolylineGlowMaterialProperty({
                glowPower: 0.2,
                color: Cesium.Color.WHITE.withAlpha(0.9)
              })
            }
          });
        } else {
          lineEntity.polyline.positions = arcPositions;
        }
      } else {
        viewer.entities.removeById("trajectory_line");
      }

      // 5. blast rings and legend if launched
      if (state.launched && state.impact && state.impact.radii_km && state.destination) {
        renderImpact(state);
      } else {
        clearImpact();
      }
    }

    // poll backend state every 250ms
    async function pollState() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) return;
        const state = await res.json();

        if (state.pick_mode && state.pick_mode !== currentPickMode) {
          currentPickMode = state.pick_mode;
          const modeLabel = currentPickMode === "origin" ? "Launch site"
            : currentPickMode === "none" ? "Off (drag a pin to move it)" : "Target";
          const pill = document.getElementById("pillModeText");
          if (pill) pill.innerText = "Map Click Mode: " + modeLabel;
        }

        if (state.fly_to && state.fly_to.fly_id !== lastFlyId) {
          lastFlyId = state.fly_to.fly_id;
          const height = Math.max(state.fly_to.height || 350000.0, 100.0);
          const destination = Cesium.Cartesian3.fromDegrees(state.fly_to.lon, state.fly_to.lat, height);
          if (reduceMotion) {
            viewer.camera.setView({ destination });
          } else {
            // no fixed duration: cesium scales it with distance (short hops quick, long
            // flights up to 3 s). ease-in-out because the camera moves across the screen.
            viewer.camera.flyTo({ destination, easingFunction: Cesium.EasingFunction.QUARTIC_IN_OUT });
          }
        }

        if (state.version !== lastVersion) {
          lastVersion = state.version;
          renderState(state);
        }
      } catch (err) {
        // silent when connection is idle
      }
    }

    setInterval(pollState, 250);
  </script>
</body>
</html>
